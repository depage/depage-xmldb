name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  php-compatibility:
    name: PHP compatibility (phpcs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Check PHP version compatibility
        run: vendor/bin/phpcs

  coding-style:
    name: Code style (php-cs-fixer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Check code style
        run: vendor/bin/php-cs-fixer check --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: '1'

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    services:
      # MariaDB, not MySQL: Sql/*.sql uses zero-date column defaults
      # (DEFAULT '0000-00-00 00:00:00') that mysql:8's default sql_mode
      # (NO_ZERO_DATE) rejects; MariaDB is what this schema targets.
      mariadb:
        image: mariadb:11
        env:
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_db_user
          MYSQL_PASSWORD: test_db_password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      # Tests/PhpUnit.xml connects to host.docker.internal; on GitHub runners
      # that name does not exist, so point it at the service container here.
      - name: Resolve host.docker.internal on the runner
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, xml, mbstring, pdo, pdo_mysql, xsl
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage --configuration Tests/PhpUnit.xml Tests/
